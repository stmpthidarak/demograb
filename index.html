<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Coach | ต้นแบบภาษาไทย</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5f1;color:#14392e;font-family:system-ui,'Tahoma',sans-serif}.wrap{max-width:440px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 25px #d5e5dc}.head{background:#07884b;color:white;padding:20px 22px}.head small{opacity:.85}.body{padding:22px}.steps{display:flex;gap:5px;margin:12px 0 22px}.steps span{height:6px;flex:1;background:#d8e6df;border-radius:8px}.steps span.on{background:#06a65c}h1{font-size:23px;margin:8px 0 10px}h2{font-size:18px}p{line-height:1.65}.muted{color:#667c73;font-size:13px}.card{border:1px solid #e1eae5;border-radius:15px;padding:16px;margin:12px 0;background:#fff}.soft{background:#f0f9f3}.green{color:#07884b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:22px;font-weight:750;margin:8px 0}input,select{width:100%;border:1px solid #d5dfd9;border-radius:9px;padding:12px;margin:7px 0 15px;font-size:16px;background:white}label{font-weight:600;font-size:14px}button{border:0;border-radius:11px;padding:14px 16px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:#079552;color:white;flex:1}.secondary{background:#e8f1eb;color:#16513a}.nav{display:flex;gap:10px;margin-top:25px}.pill{display:inline-block;border-radius:30px;background:#dcf6e7;color:#087b47;padding:6px 10px;font-size:12px;font-weight:700}.bar{height:12px;background:#e3eee8;border-radius:12px;overflow:hidden}.fill{height:100%;background:#0aa568}.check{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #edf1ee}.check input{width:20px;margin:0;accent-color:#079552}.note{background:#fff7e3;padding:12px;border-radius:10px;font-size:13px;margin-top:16px}.hidden{display:none}</style></head><body><main class="wrap"><header class="head"><b>✦ Smart Coach</b><div><small>ผู้ช่วยพัฒนาธุรกิจร้านอาหาร • ต้นแบบ</small></div></header><div class="body"><div id="progress" class="steps"></div><div id="screen"></div><div class="nav"><button id="back" class="secondary" onclick="move(-1)">ย้อนกลับ</button><button id="next" class="primary" onclick="move(1)">ถัดไป →</button></div><div class="note">ข้อมูลยอดขาย ผลลัพธ์ และคำแนะนำทั้งหมดเป็นตัวอย่างสมมติ ไม่ได้เชื่อมต่อระบบ Grab หรือ AI จริง</div></div></main><script>let page=0,done=[false,false,false],name=localStorage.getItem('shopname')||'ร้านกะเพราอร่อยดี',goal=localStorage.getItem('goal')||'เพิ่มกำไร';const el=document.getElementById('screen');function move(n){if(page===0){name=document.getElementById('shop')?.value||name;goal=document.getElementById('goal')?.value||goal;localStorage.setItem('shopname',name);localStorage.setItem('goal',goal)}page=Math.max(0,Math.min(4,page+n));render()}function tick(i){done[i]=!done[i];render()}function render(){document.getElementById('progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<=page?'on':''}"></span>`).join('');document.getElementById('back').style.visibility=page===0?'hidden':'visible';document.getElementById('next').textContent=page===4?'เริ่มใหม่ ↻':'ถัดไป →';document.getElementById('next').onclick=page===4?()=>{page=0;render()}:()=>move(1);let pages=[`<span class="pill">ขั้นตอน 1/5 · รู้จักร้านค้า</span><h1>สวัสดีเจ้าของร้าน 👋</h1><p>เริ่มจากข้อมูลเล็กน้อย เพื่อให้ Smart Coach ช่วยวางแผนการเติบโตของร้าน</p><label>ชื่อร้านอาหาร</label><input id="shop" value="${name.replaceAll('"','&quot;')}"><label>เป้าหมายหลัก</label><select id="goal"><option ${goal==='เพิ่มกำไร'?'selected':''}>เพิ่มกำไร</option><option ${goal==='เพิ่มยอดขาย'?'selected':''}>เพิ่มยอดขาย</option><option ${goal==='รักษาลูกค้าประจำ'?'selected':''}>รักษาลูกค้าประจำ</option></select><div class="card soft">🎯 AI จะสร้างภารกิจให้เหมาะกับเป้าหมายของร้านคุณ</div>`,`<span class="pill">ขั้นตอน 2/5 · วิเคราะห์ธุรกิจ</span><h1>ภาพรวมร้าน ${name}</h1><p class="muted">ข้อมูลตัวอย่างในช่วง 30 วันที่ผ่านมา</p><div class="grid"><div class="card"><div class="muted">ยอดขาย</div><div class="metric">฿32,500</div><span class="green">↑ 8%</span></div><div class="card"><div class="muted">ออร์เดอร์</div><div class="metric">460</div><span class="green">↑ 5%</span></div></div><div class="card soft"><h2>✨ AI พบโอกาส</h2><p>ช่วง 11:00–14:00 มีคำสั่งซื้อสูง แต่เมนูยอดนิยมบางรายการมีกำไรต่อจานต่ำ</p><b>คำแนะนำ:</b> ทดลองชุดอาหารกลางวันที่ตั้งราคาจากต้นทุนจริง</div><div class="card"><b>เป้าหมายของคุณ:</b> ${goal}</div>`,`<span class="pill">ขั้นตอน 3/5 · เรียนรู้</span><h1>บทเรียนสั้น 3 นาที 📚</h1><h2>ตั้งราคาชุดอาหารอย่างไรให้มีกำไร?</h2><div class="card"><p>1. รวมต้นทุนอาหารและบรรจุภัณฑ์</p><p>2. คำนวณค่าธรรมเนียมและต้นทุนโปรโมชัน</p><p>3. ตั้งราคาให้เหลือกำไรตามเป้าหมาย</p><p>4. ทดลองขายและวัดผลก่อนขยาย</p></div><div class="card soft"><b>ตัวอย่างสมมติ</b><p>ราคาขาย 89 บาท − ต้นทุนรวม 65 บาท = กำไรส่วนเพิ่ม 24 บาทต่อชุด</p><small>ต้องคำนวณต้นทุนจริงของแต่ละร้านก่อนใช้งาน</small></div>`,`<span class="pill">ขั้นตอน 4/5 · ลงมือทำ</span><h1>ภารกิจเพิ่มยอดขาย 🎯</h1><p>ทดลองชุดอาหารกลางวันเป็นเวลา 7 วัน</p><div class="card"><h2>เช็กลิสต์ภารกิจ</h2>${['คำนวณต้นทุนและตั้งราคาชุดอาหาร','เตรียมรูปและรายละเอียดเมนู','ทดลองขายและบันทึกผล 7 วัน'].map((t,i)=>`<label class="check"><input type="checkbox" ${done[i]?'checked':''} onchange="tick(${i})">${t}</label>`).join('')}<p class="muted">สำเร็จ ${done.filter(Boolean).length} จาก 3 ขั้นตอน</p><div class="bar"><div class="fill" style="width:${done.filter(Boolean).length/3*100}%"></div></div></div><div class="card soft">💡 เป้าหมาย: เพิ่มกำไรจากออร์เดอร์ช่วงกลางวัน โดยไม่พึ่งการลดราคาเพียงอย่างเดียว</div>`,`<span class="pill">ขั้นตอน 5/5 · ติดตามการเติบโต</span><h1>ร้านของคุณเติบโตอย่างไร? 📈</h1><p class="muted">ผลการทดลองสมมติ เพื่อแสดงแนวคิดการวัดผล</p><div class="grid"><div class="card"><div class="muted">ออร์เดอร์/วัน ก่อน</div><div class="metric">42</div></div><div class="card soft"><div class="muted">ออร์เดอร์/วัน หลัง</div><div class="metric green">47</div></div></div><div class="card"><h2>ผลลัพธ์ตัวอย่าง</h2><p>📈 ออร์เดอร์เพิ่มประมาณ 12%</p><p>💰 กำไรส่วนเพิ่มเพิ่มประมาณ 8%</p><p>🏅 ภารกิจที่ทำสำเร็จ ${done.filter(Boolean).length}/3</p></div><div class="card soft"><h2>แผนต่อไป</h2><p>ทดลองปรับเมนูที่กำไรต่ำ และติดตามลูกค้าซื้อซ้ำใน 30 วัน เพื่อให้ร้านเติบโตอย่างยั่งยืนบนแพลตฟอร์ม</p></div>`];el.innerHTML=pages[page]}render();</script></body></html>
